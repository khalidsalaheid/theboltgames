<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flappy Bird - TheBoltGames</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    .top-bar {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .back-btn {
      background: #1a1a26;
      border: 1px solid #2a2a3a;
      color: #e8e8f0;
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 4px;
    }
    .back-btn:hover { border-color: #f5c400; color: #f5c400; }
    h1 { color: #f5c400; font-size: 1.5rem; }
    canvas { border: 2px solid #2a2a3a; border-radius: 4px; display: block; }
    .instructions { color: #6b6b80; font-size: 0.85rem; margin-top: 1rem; }
  </style>
</head>
<body>

<div class="top-bar">
  <button class="back-btn" onclick="window.location.href='/'">← Back</button>
  <h1>⚡ Flappy Bird</h1>
</div>

<canvas id="canvas" width="400" height="550"></canvas>
<p class="instructions">Press Space or tap to flap!</p>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // AUDIO
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playSound(type) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'flap') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    if (type === 'score') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(500, audioCtx.currentTime);
      osc.frequency.setValueAtTime(700, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    if (type === 'die') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    }
  }

  let bird, pipes, score, highScore, gameState, animFrame, frameCount;

  const GRAVITY = 0.5, JUMP = -9, PIPE_W = 60, PIPE_GAP = 150, PIPE_SPEED = 3, BIRD_SIZE = 24;

  function init() {
    bird = { x: 80, y: H / 2, vy: 0, angle: 0 };
    pipes = [];
    score = 0;
    highScore = highScore || 0;
    gameState = 'waiting';
    frameCount = 0;
    cancelAnimationFrame(animFrame);
    loop();
  }

  function jump() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (gameState === 'waiting') gameState = 'playing';
    if (gameState === 'playing') {
      bird.vy = JUMP;
      playSound('flap');
    }
    if (gameState === 'dead') init();
  }

  document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); jump(); } });
  canvas.addEventListener('click', jump);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); });

  function addPipe() {
    const topH = 80 + Math.random() * (H - PIPE_GAP - 160);
    pipes.push({ x: W, topH, scored: false });
  }

  function update() {
    if (gameState !== 'playing') return;
    frameCount++;
    if (frameCount % 90 === 0) addPipe();

    bird.vy += GRAVITY;
    bird.y += bird.vy;
    bird.angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.vy * 0.05));

    if (bird.y + BIRD_SIZE / 2 > H || bird.y - BIRD_SIZE / 2 < 0) { die(); return; }

    for (let p of pipes) {
      p.x -= PIPE_SPEED;
      if (
        bird.x + BIRD_SIZE / 2 - 4 > p.x &&
        bird.x - BIRD_SIZE / 2 + 4 < p.x + PIPE_W &&
        (bird.y - BIRD_SIZE / 2 + 4 < p.topH || bird.y + BIRD_SIZE / 2 - 4 > p.topH + PIPE_GAP)
      ) { die(); return; }

      if (!p.scored && p.x + PIPE_W < bird.x) {
        score++;
        p.scored = true;
        playSound('score');
      }
    }
    pipes = pipes.filter(p => p.x + PIPE_W > 0);
  }

  function die() {
    gameState = 'dead';
    if (score > highScore) highScore = score;
    playSound('die');
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.angle);
    ctx.fillStyle = '#f5c400';
    ctx.beginPath();
    ctx.ellipse(0, 0, BIRD_SIZE / 2, BIRD_SIZE / 2 * 0.8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e0a800';
    ctx.beginPath();
    ctx.ellipse(-4, 4, 8, 5, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(6, -4, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(7, -4, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff6600';
    ctx.beginPath();
    ctx.moveTo(10, 0);
    ctx.lineTo(18, -3);
    ctx.lineTo(18, 3);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawPipe(p) {
    ctx.fillStyle = '#2ecc71';
    ctx.fillRect(p.x, 0, PIPE_W, p.topH - 20);
    ctx.fillStyle = '#27ae60';
    ctx.beginPath();
    ctx.roundRect(p.x - 5, p.topH - 20, PIPE_W + 10, 20, 6);
    ctx.fill();
    const botY = p.topH + PIPE_GAP;
    ctx.fillStyle = '#2ecc71';
    ctx.fillRect(p.x, botY + 20, PIPE_W, H - botY - 20);
    ctx.fillStyle = '#27ae60';
    ctx.beginPath();
    ctx.roundRect(p.x - 5, botY, PIPE_W + 10, 20, 6);
    ctx.fill();
  }

  function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0a2a');
    grad.addColorStop(1, '#0a1a0a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (let i = 0; i < 30; i++) ctx.fillRect((i * 137) % W, (i * 97) % (H * 0.6), 1.5, 1.5);
    ctx.fillStyle = '#1a2a1a';
    ctx.fillRect(0, H - 20, W, 20);
    ctx.fillStyle = '#2a3a2a';
    ctx.fillRect(0, H - 20, W, 4);
  }

  function draw() {
    drawBackground();
    pipes.forEach(drawPipe);
    drawBird();
    ctx.fillStyle = '#f5c400';
    ctx.font = 'bold 36px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(score, W / 2, 60);
    ctx.fillStyle = '#6b6b80';
    ctx.font = '14px Arial';
    ctx.fillText('Best: ' + highScore, W / 2, 85);

    if (gameState === 'waiting') {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#f5c400';
      ctx.font = 'bold 28px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Flappy Bird', W / 2, H / 2 - 40);
      ctx.fillStyle = '#e8e8f0';
      ctx.font = '18px Arial';
      ctx.fillText('Tap or press Space to start', W / 2, H / 2 + 10);
    }

    if (gameState === 'dead') {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ff4d4d';
      ctx.font = 'bold 32px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over!', W / 2, H / 2 - 50);
      ctx.fillStyle = '#f5c400';
      ctx.font = '24px Arial';
      ctx.fillText('Score: ' + score, W / 2, H / 2);
      ctx.fillStyle = '#e8e8f0';
      ctx.font = '18px Arial';
      ctx.fillText('Tap to play again', W / 2, H / 2 + 50);
    }
  }

  function loop() {
    update();
    draw();
    animFrame = requestAnimationFrame(loop);
  }

  init();
</script>
</body>
</html>
