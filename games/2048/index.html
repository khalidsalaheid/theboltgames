<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>2048 - TheBoltGames</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Arial', sans-serif;
      color: #e8e8f0;
    }

    h1 {
      font-size: 3rem;
      color: #f5c400;
      margin-bottom: 0.5rem;
      letter-spacing: -2px;
    }

    .subtitle { color: #6b6b80; margin-bottom: 1rem; font-size: 0.9rem; }

    .scores {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .score-box {
      background: #1a1a26;
      border: 1px solid #2a2a3a;
      padding: 0.5rem 1.5rem;
      border-radius: 4px;
      text-align: center;
    }

    .score-label { font-size: 0.7rem; color: #6b6b80; text-transform: uppercase; letter-spacing: 0.1em; }
    .score-value { font-size: 1.5rem; font-weight: bold; color: #f5c400; }

    .controls {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    button {
      background: #f5c400;
      border: none;
      color: #000;
      padding: 0.5rem 1.5rem;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }

    .back-btn {
      background: #1a1a26;
      border: 1px solid #2a2a3a;
      color: #e8e8f0;
    }

    .grid-container {
      background: #1a1a26;
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #2a2a3a;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 100px);
      grid-template-rows: repeat(4, 100px);
      gap: 10px;
    }

    .cell {
      width: 100px;
      height: 100px;
      background: #12121a;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: bold;
      transition: all 0.1s ease;
      border: 1px solid #2a2a3a;
    }

    .cell[data-value="2"]    { background: #1a2a1a; color: #7fff7f; }
    .cell[data-value="4"]    { background: #1a2a2a; color: #7fffff; }
    .cell[data-value="8"]    { background: #2a1a1a; color: #ff9f7f; }
    .cell[data-value="16"]   { background: #2a2a1a; color: #ffff7f; }
    .cell[data-value="32"]   { background: #2a1a2a; color: #ff7fff; }
    .cell[data-value="64"]   { background: #1a1a3a; color: #7f7fff; }
    .cell[data-value="128"]  { background: #f5c400; color: #000; font-size: 1.4rem; }
    .cell[data-value="256"]  { background: #ff9900; color: #000; font-size: 1.4rem; }
    .cell[data-value="512"]  { background: #ff4400; color: #fff; font-size: 1.4rem; }
    .cell[data-value="1024"] { background: #cc0000; color: #fff; font-size: 1.1rem; }
    .cell[data-value="2048"] { background: #f5c400; color: #000; font-size: 1.1rem; border: 3px solid #fff; }

    .message {
      margin-top: 1rem;
      font-size: 1.1rem;
      color: #f5c400;
      height: 1.5rem;
    }

    .instructions {
      margin-top: 1rem;
      color: #6b6b80;
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>2048</h1>
  <p class="subtitle">Combine tiles to reach 2048!</p>

  <div class="scores">
    <div class="score-box">
      <div class="score-label">Score</div>
      <div class="score-value" id="score">0</div>
    </div>
    <div class="score-box">
      <div class="score-label">Best</div>
      <div class="score-value" id="best">0</div>
    </div>
  </div>

  <div class="controls">
    <button onclick="newGame()">New Game</button>
    <button class="back-btn" onclick="window.location.href='/'">← Back</button>
  </div>

  <div class="grid-container">
    <div class="grid" id="grid"></div>
  </div>

  <div class="message" id="message"></div>
  <p class="instructions">Use arrow keys or swipe to move tiles</p>

<script>
  let board = [];
  let score = 0;
  let best = 0;
  let gameOver = false;

  function newGame() {
    board = Array(4).fill(null).map(() => Array(4).fill(0));
    score = 0;
    gameOver = false;
    document.getElementById('message').textContent = '';
    addRandom();
    addRandom();
    render();
  }

  function addRandom() {
    let empty = [];
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 4; c++)
        if (board[r][c] === 0) empty.push([r, c]);
    if (empty.length === 0) return;
    let [r, c] = empty[Math.floor(Math.random() * empty.length)];
    board[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function render() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        const val = board[r][c];
        if (val !== 0) {
          cell.textContent = val;
          cell.setAttribute('data-value', val);
        }
        grid.appendChild(cell);
      }
    }
    document.getElementById('score').textContent = score;
    if (score > best) {
      best = score;
      document.getElementById('best').textContent = best;
    }
  }

  function move(dir) {
    if (gameOver) return;
    let moved = false;

    function slide(row) {
      let arr = row.filter(x => x !== 0);
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i+1]) {
          arr[i] *= 2;
          score += arr[i];
          arr.splice(i+1, 1);
          moved = true;
        }
      }
      while (arr.length < 4) arr.push(0);
      return arr;
    }

    if (dir === 'left') {
      for (let r = 0; r < 4; r++) {
        let newRow = slide(board[r]);
        if (newRow.join() !== board[r].join()) moved = true;
        board[r] = newRow;
      }
    } else if (dir === 'right') {
      for (let r = 0; r < 4; r++) {
        let newRow = slide([...board[r]].reverse()).reverse();
        if (newRow.join() !== board[r].join()) moved = true;
        board[r] = newRow;
      }
    } else if (dir === 'up') {
      for (let c = 0; c < 4; c++) {
        let col = board.map(r => r[c]);
        let newCol = slide(col);
        newCol.forEach((val, r) => {
          if (board[r][c] !== val) moved = true;
          board[r][c] = val;
        });
      }
    } else if (dir === 'down') {
      for (let c = 0; c < 4; c++) {
        let col = board.map(r => r[c]);
        let newCol = slide([...col].reverse()).reverse();
        newCol.forEach((val, r) => {
          if (board[r][c] !== val) moved = true;
          board[r][c] = val;
        });
      }
    }

    if (moved) {
      addRandom();
      render();
      checkWin();
      checkLose();
    }
  }

  function checkWin() {
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 4; c++)
        if (board[r][c] === 2048) {
          document.getElementById('message').textContent = '🎉 You reached 2048!';
        }
  }

  function checkLose() {
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 4; c++)
        if (board[r][c] === 0) return;
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 4; c++) {
        if (c < 3 && board[r][c] === board[r][c+1]) return;
        if (r < 3 && board[r][c] === board[r+1][c]) return;
      }
    gameOver = true;
    document.getElementById('message').textContent = '😞 Game Over! Press New Game to try again.';
  }

  // Keyboard controls
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') { e.preventDefault(); move('left'); }
    if (e.key === 'ArrowRight') { e.preventDefault(); move('right'); }
    if (e.key === 'ArrowUp') { e.preventDefault(); move('up'); }
    if (e.key === 'ArrowDown') { e.preventDefault(); move('down'); }
  });

  // Swipe controls
  let startX, startY;
  document.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  });
  document.addEventListener('touchend', e => {
    let dx = e.changedTouches[0].clientX - startX;
    let dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > Math.abs(dy)) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  });

  newGame();
</script>

</body>
</html>
